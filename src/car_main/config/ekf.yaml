ekf_filter_node:
  ros__parameters:
    use_sim_time: false 

    frequency: 50.0
    sensor_timeout: 0.2

    two_d_mode: true 
    print_diagnostics: true

    publish_tf: true        
    publish_acceleration: false
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom 

    odom0: odom
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [true,  true,  false,
                   false, false, false, # Chắc chắn Yaw là false
                   true,  true,  false,
                   false, false, true, # Chắc chắn Vyaw là false
                   false, false, false]

    odom0_differential: false

    imu0: /imu_data
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
