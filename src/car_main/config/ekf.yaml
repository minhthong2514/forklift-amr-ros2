ekf_filter_node:
  ros__parameters:
    use_sim_time: false 
    frequency: 30.0
    sensor_timeout: 0.2

    two_d_mode: true 
    print_diagnostics: true

    publish_tf: true        
    publish_acceleration: true
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom 

    odom0: mecanum/odom
    odom0_config: [false, false, false, 
                   false, false, false,
                   true , true , false, 
                   false, false, false,
                   false, false, false]
    odom0_differential: false           
    odom0_relative: false

    odom1: /zed2/zed_node/odom
    odom1_config: [ false, false, false,  # Bỏ X, Y, Z (Không lấy vị trí)
                    false, false, true,  # Bỏ Roll, Pitch, Yaw (Không lấy góc quay)
                    true,  true,  false,  # 🌟 CHỈ LẤY Vx, Vy (Vận tốc trượt ngang/dọc)
                    false, false, true,   # 🌟 CHỈ LẤY V_yaw (Vận tốc xoay tại chỗ)
                    false, false, false]  # Bỏ Gia tốc
                    
    odom1_differential: false   
    odom1_relative: true                  
    odom1_queue_size: 10

    imu0: imu_data
    imu0_config: [false, false, false,
                  false, false, true, 
                  false, false, false,
                  false, false, true,  
                  false, false, false] 

