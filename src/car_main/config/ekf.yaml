                  false, false, true,  # BẬT Yaw (hướng xoay)
                  false, false, false,
                  false, false, true,  # BẬT Vyaw (tốc độ xoay)
                  false,  false,  false] # Nếu robot chạy bị giật thì chuyển thành false vì imu nhiễu gia tốc

