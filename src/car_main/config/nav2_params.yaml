    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" 
      # --- Cấu hình cơ bản ---
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.15                 # Ép sai số tìm đường nhỏ hơn (0.25 thay vì 0.5)
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 2000
      max_planning_time: 5.0
      
      # --- Động học cho Xe nâng Mecanum ---
      motion_model_for_search: "REEDS_SHEPP" # QUAN TRỌNG: Cho phép xe đi lùi (Dubin chỉ cho tiến nguoc lai REEDS_SHEPP)
      angle_quantization_bins: 72            # Sửa lỗi chính tả `_ns`: Chia 360 độ thành 72 góc
      minimum_turning_radius: 0.65            # Khai báo Mecanum (xoay tại chỗ)
      use_final_approach_orientation: true   # Ép xe cập bến đúng góc
      
      # --- Cấu hình mở rộng quỹ đạo (Analytic Expansion) ---
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      
      # --- Tối ưu hóa hành vi (Penalties) ---
      reverse_penalty: 3.0           # Giảm từ 2.0 xuống 1.5 để xe không "sợ" đi lùi khi cần lấy pallet
      change_penalty: 2.0            # Phạt nhẹ khi đổi chiều tiến/lùi liên tục (tránh giật cục)
      non_straight_penalty: 3.5      # Phạt nhẹ khi đi chéo/ngang để ưu tiên đi thẳng (giảm trượt bánh Mecanum)
      cost_penalty: 3.5              # Tăng lên 3.0 để ép xe đi vào GIỮA hành lang, tránh xa tường
      retrospective_penalty: 0.015
      
      # --- Cấu hình nội bộ ---
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: False
      downsample_obstacle_heuristic: True
      allow_primitive_interpolation: False
      coarse_search_resolution: 4
      goal_heading_mode: "DEFAULT"
      
      # --- Bộ làm mượt đường đi tích hợp ---
      smooth_path: True 
      smoother:
        max_iterations: 1000
        w_smooth: 0.15
        w_data: 0.45
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

