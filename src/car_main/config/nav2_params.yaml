bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    # Goal checker parameters
    general_goal_checker:
     plugin: "nav2_controller::SimpleGoalChecker"
     xy_goal_tolerance: 0.05
     yaw_goal_tolerance: 0.1
     path_length_tolerance: 1.0
     stateful: True
    
    # general_goal_checker:
    #   stateful: True
    #   plugin: "nav2_controller::StoppedGoalChecker"
    #   xy_goal_tolerance: 0.05
    #   yaw_goal_tolerance: 0.1    #0.05
    #   rot_stopped_velocity: 0.1
    #   trans_stopped_velocity: 0.1

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.15
      max_vel_x: 0.35
      min_vel_y: -0.20
      max_vel_y: 0.20
      max_vel_theta: 0.35
      min_speed_xy: 0.02
      max_speed_xy: 0.25
      min_speed_theta: 0.15
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.5
      acc_lim_y: 0.3
      acc_lim_theta: 0.5
      decel_lim_x: -0.8
      decel_lim_y: -0.5
      decel_lim_theta: -0.8
      vx_samples: 10
      vy_samples: 3
      vtheta_samples: 10
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.1       # Default: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # BaseObstacle.scale: 10.0
      ObstacleFootprint.scale: 0.05    
      PathAlign.scale: 85.0
      PathAlign.forward_point_distance: 0.3
      GoalAlign.scale: 32.0
      GoalAlign.forward_point_distance: 0.3
      PathDist.scale: 45.0
      GoalDist.scale: 20.0   
      RotateToGoal.scale: 45.0
      RotateToGoal.slowing_factor: 20.0 
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.xy_goal_tolerance: 0.15
      discretize_by_time: True            # BẬT LÊN ĐỂ ROBOT TÍNH TOÁN ĐƯỜNG ĐI THEO THỜI GIAN NGẮN ==> PHÙ HỢP CHO XE CẦN ĐỘ CHÍNH XÁC CAO

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # footprint: "[
      #   [-0.27, 0.220], [-0.150, 0.220], [-0.150, 0.145], [0.150, 0.145], 
      #   [0.150, 0.220], [0.255, 0.220], [0.255, 0.145], [0.31, 0.145], [0.31, 0.1], 
      #   [0.62, 0.1], [0.62, 0.08], [0.62, -0.08], [0.62, -0.1], 
      #   [0.31, -0.1], [0.31, -0.145], [0.255, -0.145], [0.255, -0.220], [0.150, -0.220], 
      #   [0.150, -0.145], [-0.150, -0.145], [-0.150, -0.220], [-0.27, -0.220]
      # ]"
      footprint: "[[-0.27, 0.22], [0.255, 0.22], [0.31, 0.145], [0.62, 0.1], [0.62, 0.08], [0.62, -0.08], [0.62, -0.1], [0.31, -0.145], [0.255, -0.22], [-0.27, -0.22]]"

      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "stvl_layer", "inflation_layer"]
      # Static layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
      # Obstacle layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: /scan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.2
          obstacle_max_range: 3.0
          obstacle_min_range: 0.2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true
      # Voxel layer
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: true
      #   footprint_clearing_enabled: true
      #   publish_voxel_map: False
      #   origin_z: 0.0
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 0.7
      #   unknown_threshold: 15
      #   mark_threshold: 3
      #   observation_sources: pointcloud
      #   combination_method: 1
      #   pointcloud:
      #     topic: /zed2/zed_node/point_cloud/cloud_registered
      #     raytrace_max_range: 3.5
      #     raytrace_min_range: 0.2
      #     obstacle_max_range: 3.0
      #     obstacle_min_range: 0.2 
      #     max_obstacle_height: 0.7
      #     min_obstacle_height: 0.0
      #     clearing: True
      #     marking: True
      #     data_type: "PointCloud2"
      #     inf_is_valid: false
      #     transport_type: "raw"

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0            
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false    # Tắt đi để tiết kiệm tài nguyên CPU/GPU cho Jetson
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud
        pointcloud:
          data_type: PointCloud2
          topic: /zed2/zed_node/point_cloud/cloud_registered  # Đã đổi sang topic ZED2 của bạn
          marking: true
          clearing: true
          obstacle_range: 3.0       # Khớp với obstacle_max_range cũ của bạn
          min_obstacle_height: 0.05 # Khuyên dùng để 4cm để lọc nhiễu sần sùi của sàn nhà
          max_obstacle_height: 0.7  # Khớp với chiều cao trần quét cũ của bạn (70cm)
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: false
          max_z: 3.5               
          min_z: 0.3      
          vertical_fov_angle: 0.60          
          horizontal_fov_angle: 1.76   
          decay_acceleration: 15.0
          model_type: 0

      # Inflation layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflate_unknown: false
        inflate_around_unknown: true
        cost_scaling_factor: 15.0
        inflation_radius: 0.70                           # Đây có khoảng cách an toàn tính từ tâm xe tới vị trí xe nhất (lấy trừ hao thềm khoảng 15-20cm nữa)
      always_send_full_costmap: True
      introspection_mode: "disabled"

